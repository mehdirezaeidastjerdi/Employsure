name: Deploy MultiDucker

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
      - run: docker build -t clyrix/react-test -f ./client/Dockerfile.dev ./client
      - run: docker run -e CI=true clyrix/react-test  npm test
      
      - run: docker build  -t clyrix/multi-client ./client
      - run: docker build  -t clyrix/multi-nginx  ./nginx
      - run: docker build  -t clyrix/multi-server  ./server
      - run: docker build  -t clyrix/multi-worker  ./worker

      - run: docker push clyrix/multi-client
      - run: docker push clyrix/multi-nginx
      - run: docker push clyrix/multi-server
      - run: docker push clyrix/multi-worker


      


    
